---
# =============================================================================
# Ansible-плейбук инициализации сервера Jesmyl.
#
# Повторяет (идемпотентно) логику из src/back/initBack.ts:
#   apt-пакеты, каталоги приложения, .env.json, PostgreSQL, logrotate/journald,
#   SWAP, systemd-юнит jesmyl_soki, package.json, certbot.
#
# Запуск полной инициализации:
#   ansible-playbook -i ansible/inventory.ini ansible/deploy.yml
#
# Только копирование собранных артефактов (плей deploy):
#   ansible-playbook -i ansible/inventory.ini ansible/deploy.yml --tags deploy
#
# ВАЖНО: артефакты собираются ЛОКАЛЬНО ДО запуска плейбука:
#   npm run build                      # соберёт frontend в ./build/
#   npx tsx do/build-back-index.ts     # соберёт src/back/back.index.cjs
# (см. do/build-back-index.ts и do/deploy-the-code.ts)
# =============================================================================

- name: Инициализация сервера Jesmyl
  hosts: jesmyl
  become: true
  gather_facts: true
  tags: [init]

  vars:
    # Каталоги из deployPathsBasicDict (paths.basic.ts) + корень.
    # initBack.ts создаёт их через fs.mkdirSync({ recursive: true }).
    deploy_dirs:
      - ""
      - apps/cm
      - apps/cm/coms
      - apps/cm/comComments
      - apps/cm/comsInSchEventHistory
      - apps/cm/comsInSchEvent
      - apps/index
      - apps/index/schedules
      - apps/q
      - apps/q/blanks
      - apps/storages/list

  handlers:
    # initBack.ts: systemctl restart postgresql после правок pg_hba/порта.
    - name: restart postgresql
      ansible.builtin.systemd:
        name: postgresql
        state: restarted
        daemon_reload: true

    # initBack.ts: logrotate -f /etc/logrotate.d/rsyslog при изменении конфига.
    - name: apply logrotate
      ansible.builtin.command: logrotate -f /etc/logrotate.d/rsyslog
      changed_when: false
      failed_when: false

    # initBack.ts: systemctl restart systemd-journald (ошибки проглатываются).
    - name: restart systemd-journald
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted
      failed_when: false

    # initBack.ts: journalctl --vacuum-size=100M (ошибки проглатываются).
    - name: vacuum systemd journal
      ansible.builtin.command: journalctl --vacuum-size=100M
      changed_when: false
      failed_when: false
      listen: restart systemd-journald

    # Перезапуск backend-сервиса при обновлении unit-файла.
    - name: restart jesmyl_soki
      ansible.builtin.systemd:
        name: jesmyl_soki
        state: restarted
        daemon_reload: true

  tasks:
    # -------------------------------------------------------------------------
    # 1. Пакеты и PostgreSQL
    #    initBack.ts: apt update; apt install -y postgresql postgresql-contrib;
    #                 systemctl enable --now postgresql
    # -------------------------------------------------------------------------
    - name: Установить системные пакеты
      ansible.builtin.apt:
        name:
          - postgresql
          - postgresql-contrib
          - certbot
          - nodejs
          - npm
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Включить и запустить PostgreSQL
      ansible.builtin.systemd:
        name: postgresql
        enabled: true
        state: started

    # -------------------------------------------------------------------------
    # 2. Каталоги приложения
    #    initBack.ts: fs.mkdirSync(hostRootDir, { recursive: true }) + deployPathsBasicDict
    # -------------------------------------------------------------------------
    - name: Создать корневую директорию и подкаталоги приложения
      ansible.builtin.file:
        path: "{{ host_root_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ deploy_dirs }}"

    - name: Выставить права 755 на корневую директорию
      ansible.builtin.file:
        path: "{{ host_root_dir }}"
        state: directory
        mode: "0755"

    # -------------------------------------------------------------------------
    # 3. .env.json — только если файла ещё нет (не перезаписываем секреты)
    #    initBack.ts: fs.writeFileSync, если файл отсутствует. Права 0600.
    # -------------------------------------------------------------------------
    - name: Создать .env.json (не перезаписывать существующий)
      ansible.builtin.template:
        src: templates/env.json.j2
        dest: "{{ host_root_dir }}/.env.json"
        owner: root
        group: root
        mode: "0600"
        force: false

    # inventory `subdomain` мог быть раскомментирован уже после первой
    # инициализации, а шаблон выше (force: false) существующий .env.json не
    # трогает. Отдельно обновляем только ключ subdomain, иначе certbot выпустит
    # сертификат, который бэкенд не будет использовать.
    - name: Прочитать существующий .env.json для обновления поддомена
      ansible.builtin.slurp:
        src: "{{ host_root_dir }}/.env.json"
      register: env_json_slurp
      when: (subdomain | default('')) | length > 0

    - name: Обновить ключ subdomain в .env.json
      ansible.builtin.copy:
        dest: "{{ host_root_dir }}/.env.json"
        owner: root
        group: root
        mode: "0600"
        content: "{{ (env_json_slurp.content | b64decode | from_json) | combine({'subdomain': subdomain}) | to_nice_json }}\n"
      when: (subdomain | default('')) | length > 0
      notify: restart jesmyl_soki

    # -------------------------------------------------------------------------
    # 4. PostgreSQL: пароль postgres, БД, pg_hba, порт
    #    В initBack.ts все шаги обёрнуты в try/catch -> failed_when: false.
    # -------------------------------------------------------------------------
    - name: Задать пароль пользователя postgres
      ansible.builtin.command:
        cmd: psql -c "ALTER USER postgres WITH PASSWORD '{{ DB_PASSWORD }}';"
      become_user: postgres
      changed_when: false
      failed_when: false

    - name: Проверить наличие базы данных
      ansible.builtin.command:
        cmd: psql -tAc "SELECT 1 FROM pg_database WHERE datname='{{ DB_NAME }}'"
      become_user: postgres
      register: db_exists
      changed_when: false
      failed_when: false

    - name: Создать базу данных, если её нет
      ansible.builtin.command:
        cmd: psql -c "CREATE DATABASE {{ DB_NAME }} OWNER {{ DB_USER }};"
      become_user: postgres
      when: (db_exists.stdout | default('') | trim) != '1'
      changed_when: true
      failed_when: false

    - name: Найти pg_hba.conf
      ansible.builtin.find:
        paths: /etc/postgresql
        patterns: pg_hba.conf
        recurse: true
        file_type: file
      register: pg_hba_files
      failed_when: false

    - name: Разрешить md5-аутентификацию по 127.0.0.1
      ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        line: "host all all 127.0.0.1/32 md5"
        state: present
      loop: "{{ pg_hba_files.files | default([]) }}"
      notify: restart postgresql
      failed_when: false

    - name: Разрешить md5-аутентификацию по ::1
      ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        line: "host all all ::1/128 md5"
        state: present
      loop: "{{ pg_hba_files.files | default([]) }}"
      notify: restart postgresql
      failed_when: false

    - name: Найти postgresql.conf
      ansible.builtin.find:
        paths: /etc/postgresql
        patterns: postgresql.conf
        recurse: true
        file_type: file
      register: pg_conf_files
      failed_when: false

    # initBack.ts: sed port=... выполняется только при DB_PORT != 5432.
    - name: Изменить порт PostgreSQL (если DB_PORT не 5432)
      ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        regexp: '^#?\s*port\s*='
        line: "port = {{ DB_PORT }}"
      loop: "{{ pg_conf_files.files | default([]) }}"
      when: DB_PORT | int != 5432
      notify: restart postgresql
      failed_when: false

    # -------------------------------------------------------------------------
    # 5. Ротация логов и journald
    #    initBack.ts: rewriteAndDo('/etc/logrotate.d/rsyslog', ...) и sed journald.
    # -------------------------------------------------------------------------
    - name: Настроить ротацию системных логов (rsyslog)
      ansible.builtin.copy:
        dest: /etc/logrotate.d/rsyslog
        owner: root
        group: root
        mode: "0644"
        content: |
          /var/log/syslog
          /var/log/mail.log
          /var/log/kern.log
          /var/log/auth.log
          /var/log/user.log
          /var/log/cron.log
          {
            su root syslog
            size 50M
            rotate 2
            missingok
            notifempty
            compress
            delaycompress
            sharedscripts
            postrotate
              /usr/lib/rsyslog/rsyslog-rotate
            endscript
          }
      notify:
        - apply logrotate
        - restart systemd-journald
      failed_when: false

    - name: Ограничить размер журнала systemd (SystemMaxUse=100M)
      ansible.builtin.lineinfile:
        path: /etc/systemd/journald.conf
        regexp: '^#?\s*SystemMaxUse='
        line: "SystemMaxUse=100M"
        state: present
      notify: restart systemd-journald
      failed_when: false

    # -------------------------------------------------------------------------
    # 6. SWAP 2 ГБ (только если /swapfile отсутствует)
    #    initBack.ts: swapon --show ... fallocate/mkswap/swapon/fstab (try/catch).
    # -------------------------------------------------------------------------
    - name: Проверить наличие /swapfile
      ansible.builtin.stat:
        path: /swapfile
      register: swap_file

    - name: Настроить файл подкачки 2 ГБ
      when: not swap_file.stat.exists
      block:
        - name: Создать /swapfile размером 2 ГБ
          ansible.builtin.command: fallocate -l 2G /swapfile
          failed_when: false

        - name: Выставить права 600 на /swapfile
          ansible.builtin.file:
            path: /swapfile
            mode: "0600"
          failed_when: false

        - name: Инициализировать swap
          ansible.builtin.command: mkswap /swapfile
          failed_when: false

        - name: Включить swap
          ansible.builtin.command: swapon /swapfile
          failed_when: false

        - name: Прописать /swapfile в /etc/fstab
          ansible.builtin.lineinfile:
            path: /etc/fstab
            line: "/swapfile none swap sw 0 0"
            state: present
          failed_when: false

    # -------------------------------------------------------------------------
    # 7. systemd-юнит jesmyl_soki.service
    #    initBack.ts: rewriteAndDo(`${systemdPath}/jesmyl_soki.service`, ...)
    #    + systemctl daemon-reload.
    # -------------------------------------------------------------------------
    - name: Установить unit-файл jesmyl_soki.service
      ansible.builtin.template:
        src: templates/jesmyl_soki.service.j2
        dest: /etc/systemd/system/jesmyl_soki.service
        owner: root
        group: root
        mode: "0644"
      notify: restart jesmyl_soki

    - name: Перечитать конфигурацию systemd
      ansible.builtin.systemd:
        daemon_reload: true

    # Артефакты (back.index.cjs) могут быть ещё не задеплоены -> не валим плейбук.
    - name: Включить и запустить сервис jesmyl_soki
      ansible.builtin.systemd:
        name: jesmyl_soki
        enabled: true
        state: started
      failed_when: false

    # -------------------------------------------------------------------------
    # 8. package.json бэкенда и npm i (если node_modules отсутствует)
    #    initBack.ts: rewriteAndDo(hostRootDir/package.json); npm i --prefix ...
    # -------------------------------------------------------------------------
    - name: Установить package.json бэкенда
      ansible.builtin.template:
        src: templates/package.json.j2
        dest: "{{ host_root_dir }}/package.json"
        owner: root
        group: root
        mode: "0644"

    - name: Установить зависимости бэкенда
      ansible.builtin.command: npm i --prefix {{ host_root_dir }}
      args:
        creates: "{{ host_root_dir }}/node_modules"

    # -------------------------------------------------------------------------
    # 9. Certbot: выпуск сертификата и cron-обновление
    #    initBack.ts: certbot certonly --standalone -d host, затем crontab.
    # -------------------------------------------------------------------------
    - name: Проверить наличие SSL-сертификата
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/{{ host }}/fullchain.pem
      register: cert_file

    - name: Выпустить SSL-сертификат Let's Encrypt
      ansible.builtin.command: certbot certonly --standalone -d {{ host }}
      when: not cert_file.stat.exists
      # Порт 80 может быть занят сервисом; initBack.ts не глотает ошибку, но для
      # идемпотентного провижининга не валим весь плейбук.
      failed_when: false

    # Defense-in-depth: subdomain подставляется в DNS-имя и путь LE, поэтому
    # до выпуска сертификата валидируем его как DNS-метку. Пустой/отсутствующий
    # subdomain пропускается (см. when остальных задач блока).
    - name: Проверить формат поддомена (DNS-label)
      ansible.builtin.assert:
        that:
          - (subdomain | trim) is match('(?i)^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
        fail_msg: >-
          subdomain '{{ subdomain }}' не является корректной DNS-меткой
          (^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$, регистр не важен).
      when: (subdomain | default('')) | length > 0

    # Поддомен (опционально, inventory var `subdomain`): отдельный сертификат
    # под конкретное имя. При пустом/отсутствующем subdomain путь ведёт в
    # несуществующую директорию, задача выпуска пропускается.
    - name: Проверить наличие SSL-сертификата поддомена
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/{{ subdomain | default('') }}.{{ host }}/fullchain.pem
      register: subdomain_cert_file

    - name: Выпустить SSL-сертификат Let's Encrypt для поддомена
      ansible.builtin.command: certbot certonly --standalone -d {{ subdomain }}.{{ host }}
      when: (subdomain | default('')) | length > 0 and not subdomain_cert_file.stat.exists
      failed_when: false

    - name: Добавить cron-задачу обновления сертификата
      ansible.builtin.cron:
        name: "certbot renew jesmyl"
        minute: "0"
        hour: "3"
        weekday: "1"
        job: >-
          certbot renew --pre-hook "systemctl stop jesmyl_soki"
          --post-hook "systemctl start jesmyl_soki"

# =============================================================================
# Deploy: копирование собранных артефактов на сервер.
# Запускается через `--tags deploy`. Артефакты должны быть собраны локально.
# =============================================================================
- name: Копирование собранных артефактов на сервер
  hosts: jesmyl
  become: true
  gather_facts: false
  tags: [deploy]

  handlers:
    - name: restart jesmyl_soki
      ansible.builtin.systemd:
        name: jesmyl_soki
        state: restarted
        daemon_reload: true

  tasks:
    - name: Проверить наличие локального каталога build/
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../build"
      delegate_to: localhost
      become: false
      register: local_build_dir

    - name: Проверить наличие локального back.index.cjs
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../src/back/back.index.cjs"
      delegate_to: localhost
      become: false
      register: local_back_index

    - name: Предупредить об отсутствии артефактов
      ansible.builtin.debug:
        msg: >-
          Локальные артефакты не найдены. Сначала выполните `npm run build`
          (frontend -> build/) и сгенерируйте src/back/back.index.cjs через
          do/build-back-index.ts, затем повторите с `--tags deploy`.
      when: not local_build_dir.stat.exists or not local_back_index.stat.exists

    - name: Скопировать собранный frontend в {{ host_root_dir }}
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../build/"
        dest: "{{ host_root_dir }}/"
        mode: "0644"
        directory_mode: "0755"
      when: local_build_dir.stat.exists

    - name: Скопировать back.index.cjs в {{ host_root_dir }}
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../src/back/back.index.cjs"
        dest: "{{ host_root_dir }}/back.index.cjs"
        owner: root
        group: root
        mode: "0644"
      when: local_back_index.stat.exists
      notify: restart jesmyl_soki
