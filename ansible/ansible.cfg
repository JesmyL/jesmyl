; Ansible-конфигурация для деплоя jesmyl на произвольный хост.
; Команды запускать из каталога ansible/ — тогда inventory и group_vars
; подхватятся автоматически.
;
; Инвентарь — динамический (inventory.py), хост задаётся на лету:
;   TARGET_HOST=<домен> TARGET_IP=<ip> ansible-playbook playbooks/all.yml --ask-vault-pass

[defaults]
inventory = inventory.py
remote_user = root
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
; accept-new: первый ключ хоста доверяем, изменившийся — отвергаем.
; (host_key_checking=accept-new в [defaults] ansible-core 2.16 игнорирует.)
ssh_common_args = -o StrictHostKeyChecking=accept-new

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False
