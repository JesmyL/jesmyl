; ============================================================================
; Инвентори Ansible для деплоя Jesmyl.
;
; Использование:
;   ansible-playbook -i ansible/inventory.ini ansible/deploy.yml
;
; Замените CHANGE_ME и адреса на реальные значения.
; Значения из [jesmyl:vars] применяются ко всем хостам группы jesmyl.
; ============================================================================

[jesmyl]
; <inventory_hostname> ansible_host=<IP или DNS сервера>
jesmyl.ru ansible_host=194.67.124.130

[jesmyl:vars]
; Домен (используется в host_root_dir, сертификатах Let's Encrypt и т.д.)
host=jesmyl.ru

; Корневая директория приложения на сервере
host_root_dir=/var/www/{{ host }}

; Порт backend-приложения (node слушает 443/4446 — см. initBack.ts)
app_port=4446

; --- PostgreSQL ---
DB_USER=postgres
DB_PASSWORD=CHANGE_ME
DB_NAME=jesmyl
DB_PORT=5432
DB_HOST=127.0.0.1

; --- Приложение ---
; Секретный ключ для .env.json (в initBack.ts генерируется отдельно)
SECURE_KEY=CHANGE_ME
; true / false — production-режим
isProd=true

; --- Опциональный поддомен ---
; Раскомментируйте, чтобы проект открывался на https://<subdomain>.<host>
; (например, sub.jesmyl.ru). Пустая строка = без поддомена (как раньше).
; Сертификат выпускается certbot --standalone под конкретное имя (без wildcard).
; При повторном запуске плейбука значение subdomain обновляется и в .env.json
; на сервере (существующий файл шаблоном не перезаписывается).
# subdomain=sub
